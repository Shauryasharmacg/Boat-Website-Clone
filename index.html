<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Boat clone</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css">
</head>

<body>
    <header>
        <nav>
            <div class="div1">
                <p>Get additional 5% off on Prepaid Orders | Code: PAYDAY | Shop Now</p>
            </div>
        </nav>
        <nav class="navbar">
            <img src="Boat logo.jpg" alt="boat logo" class="image1">
            <ul class="list1">
                <li class="li1">Categories <i class="fa-solid fa-chevron-down"></i></li>
                <li>boAt Personalisation</li>
                <li>Corporate Orders</li>
                <li>Gifting Store</li>
                <li>More <i class="fa-solid fa-chevron-down"></i> </li>
            </ul>
            <div class="div2">
                <i class="fa-solid fa-magnifying-glass" style="font-size: 6mm;"></i>
                <input type="text" placeholder="search products" class="searchbar">
            </div>
            <div class="div3">
                <i class="fa-regular fa-user" style="font-size: 25px;"></i>
            </div>
            <div class="div4">
                 <i class="fa-solid fa-bag-shopping" style="font-size: 25px;"></i>
            </div>
        </nav>
    </header>
</body>

</html>
