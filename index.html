<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Boat clone</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css">
    <link rel="icon" href="icon.png">
</head>

<body>
    <header>
        <!-- navbar -->
        <nav>
            <div class="div1">
                <p>Get additional 5% off on Prepaid Orders | Code: PAYDAY | Shop Now</p>
            </div>
        </nav>
        <nav class="navbar">
            <img src="Boat logo.jpg" alt="boat logo" class="image1">
            <ul class="list1">
                <li class="li1">Categories <i class="fa-solid fa-chevron-down"></i></li>
                <li>boAt Personalisation</li>
                <li>Corporate Orders</li>
                <li>Gifting Store</li>
                <li>More <i class="fa-solid fa-chevron-down"></i> </li>
            </ul>
            <div class="div2">
                <i class="fa-solid fa-magnifying-glass" id="search"></i>
                <input type="text" placeholder="search products" class="searchbar">
            </div>
            <div class="div3">
                <i class="fa-regular fa-user" id="user"></i>
            </div>
            <div class="div4">
                <i class="fa-solid fa-bag-shopping" id="bag"></i>
            </div>
        </nav>
        <!-- navbar completed -->
    </header>
    <!-- hero section -->
    <main>

        <div class="div5">
            
                <button class="leftarrow">
                    <i class="fa-solid fa-angle-left"></i>
                </button>
             
                <button class="rightarrow">
                    <i class="fa-solid fa-angle-right"></i>
                </button>
                <img src="hero image.png" alt="hero image" class="heroimage">
                <img src="bar under image.png" alt="bar under image" class="bar">
                <div class="div6">
                    <div class="div7">
                        <img src="extra25.png" alt="25% icon" class="extra25">
                        <p class="p1">12+3 Months</p>
                        <br>
                        <p class="p2">warranty<i class="fa-solid fa-circle-info"></i></p>
                    </div>
                    <div class="div8">
                        <i class="fa-solid fa-receipt" id="bill"></i>
                        <p class="p3">GST </p>
                        <p class="p4">Billing</p>
                    </div>
                    <div class="div9">
                        <i class="fa-solid fa-truck-fast" id="truck"></i>
                        <p class="p5">Free Express</p>
                        <p class="p6">Delivery <sup class="super">*</sup></p>
                    </div>
                    <div class="div10">
                        <i class="fa-solid fa-box-open" id="box"></i>
                        <p class="p7">7-day</p>
                        <p class="p8"> Replacement</p>
                    </div>
                </div>
        </div>
        
    </main>
</body>

</html>
